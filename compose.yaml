name: imkonex-wheels
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.portal
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "10000"
      MANAGER_DB_PATH: /var/data/manager.sqlite3
    ports:
      - "127.0.0.1:8080:10000"
    volumes:
      - manager_data:/var/data
    mem_limit: 2g
    cpus: 1
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    profiles: [public]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  manager_data:
  caddy_data:
  caddy_config:
